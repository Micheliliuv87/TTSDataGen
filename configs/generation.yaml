generator:
  base_url: "http://localhost:1234/v1"
  api_key: "lm-studio"
  model: "qwen3-32b-mlx"
  temperature: 0.55
  top_p: 0.9
  max_tokens: 12000
  timeout_seconds: 1200

source_anchors:
  output_dir: "outputs/source_packs"
  latest_path: "outputs/source_packs/latest_source_anchor_pack.json"

  max_sources: 10
  max_anchors: 6

  anchor_excerpt_chars: 1800
  top_scored_sentence_preview_chars: 220

  min_sentence_score: 1.6
  min_anchor_score: 3.0
  min_core_anchor_score: 6.0
  min_clean_chars: 120

  require_topic_sentence_evidence: true
  require_strong_match: true

  window_before: 0
  window_after: 1

  drop_noise: true
  drop_ads: true
  reject_ad_like_sources: true
  max_ad_sentence_ratio: 0.30
  max_noise_sentence_ratio: 0.50
  max_promo_marker_count: 1

  allow_clean_source_fallback: false
  allow_trimmed_source_fallback: false

  enable_diversity_filter: true
  max_anchors_per_doc_id: 1
  max_anchors_per_podcast_slug: 2
  near_duplicate_jaccard_threshold: 0.72

  allow_context_anchors: false

dialogue:
  default_rounds: 30
  language: "Chinese"
  speaker_a: "A"
  speaker_b: "B"
  output_dir: "outputs/dialogues"
  source_appendix_excerpt_chars: 1200

prompt_templates:
  path: "configs/prompt_templates.yaml"

rules:
  generation:
    enabled: true
    path: "knowledge_base/rules/generation_rules.jsonl"
    format: "compact"
    max_rules: 10
    max_chars: 5200

brief:
  latest_path: "outputs/source_packs/latest_generation_brief.json"